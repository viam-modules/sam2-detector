on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "Validating tag: $TAG"
          if [[ $TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]*)?$ ]]; then
            echo "Tag matches semver."
          else
            echo "Error: tag does not match semver"
            exit 1
          fi

  # Build and upload the platform variants (sequentially to avoid race conditions).
  #
  # The build target is NOT passed as an env var here: these are Viam cloud builds,
  # which run on Viam's infrastructure from the git ref, so env vars set in this
  # workflow never reach the builder. detect_target.sh derives the target from the
  # build machine instead — linux/amd64 resolves to the CUDA build, darwin/arm64
  # to the standard MPS build.
  publish:
    needs: validate-tag
    strategy:
      max-parallel: 1
      matrix:
        platform:
          # macOS Apple Silicon — onefile, standard torch (MPS).
          - darwin/arm64
          # Linux x86_64 — onedir, CUDA 12.8 torch. Uses an NVIDIA GPU when a
          # driver is present and falls back to CPU otherwise.
          - linux/amd64
    name: "Build (${{ matrix.platform }})"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Publish
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: viamrobotics/build-action@v1.6
        with:
          version: ${{ github.event.release.tag_name }}
          ref: ${{ github.sha }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_value }}
          token: ${{ github.token }}
          platform: ${{ matrix.platform }}
